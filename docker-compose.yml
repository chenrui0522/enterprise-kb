name: enterprise-kb

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.5.4
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus:/var/lib/milvus
    ports:
      - "19530:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - etcd
      - minio

  model-service:
    image: xprobe/xinference:latest
    restart: unless-stopped
    command: ["xinference-local", "--host", "0.0.0.0", "--port", "9997"]
    environment:
      XINFERENCE_AUTH_ADVANCED: "false"
    ports:
      - "9997:9997"
    volumes:
      - xinference-cache:/root/.xinference
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9997/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      KB_DATABASE_URL: postgresql+asyncpg://kb:kb@postgres:5432/kb
      KB_DB_POOL_SIZE: "20"
      KB_DB_MAX_OVERFLOW: "40"
      KB_REDIS_URL: redis://redis:6379/0
      KB_MILVUS_URI: http://milvus:19530
      KB_EMBEDDER_BASE_URL: http://model-service:9997/v1
      KB_RERANKER_BASE_URL: http://model-service:9997/v1
      KB_DOCUMENT_STORAGE_DIR: /srv/data/documents
      # Enable MinerU OCR by uncommenting after `docker compose --profile mineru up -d`:
      # KB_MINERU_URL: http://mineru-api:8000
    volumes:
      - ./data:/srv/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      KB_DATABASE_URL: postgresql+asyncpg://kb:kb@postgres:5432/kb
      KB_REDIS_URL: redis://redis:6379/0
      KB_MILVUS_URI: http://milvus:19530
      KB_EMBEDDER_BASE_URL: http://model-service:9997/v1
      KB_RERANKER_BASE_URL: http://model-service:9997/v1
      KB_DOCUMENT_STORAGE_DIR: /srv/data/documents
      # Enable MinerU OCR by uncommenting after `docker compose --profile mineru up -d`:
      # KB_MINERU_URL: http://mineru-api:8000
    volumes:
      - ./data:/srv/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # Optional MinerU OCR worker for scanned PDFs / images / complex layout manuals.
  # Not started by default (CPU/GPU image is built separately - see README).
  # Host port 8002 is exposed so a local dev worker can call http://127.0.0.1:8002.
  mineru-api:
    image: ${MINERU_IMAGE:-mineru:latest}
    restart: unless-stopped
    profiles: ["mineru"]
    ports:
      - "8002:8000"
    entrypoint: ["mineru-api"]
    command: ["--host", "0.0.0.0", "--port", "8000"]
    environment:
      MINERU_MODEL_SOURCE: modelscope
      # MINERU_API_TASK_RETENTION_SECONDS: "86400"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - mineru-home:/root
    # GPU deployments: uncomment below and set device ids (driver must exist).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           device_ids: ["0"]
    #           capabilities: [gpu]

volumes:
  pgdata:
  etcd:
  minio:
  milvus:
  xinference-cache:
  mineru-home:
